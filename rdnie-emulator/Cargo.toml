[package]
name = "rdnie-emulator"
version = "0.2.0"
edition = "2024"
rust-version = "1.87"
license = "EUPL-1.2"
description = "Emulated Spanish electronic ID card (DNIe) behind rdnie's Transport, for tests without a card"
repository = "https://github.com/sgomez/rdnie"
readme = "README.md"
include = ["/src", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]
keywords = ["dnie", "smartcard", "emulator", "apdu", "testing"]
categories = ["development-tools::testing", "cryptography"]

[features]
# Fault knobs for rdnie's own tests; outside semver.
faults = []

[dependencies]
cbc = { version = "0.2", features = ["alloc"] }
des = "0.9"
flate2 = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
rdnie = { path = "..", version = "0.2.0", default-features = false, features = ["emulator"] }
retail-mac = "0.1"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "sha2"] }
sha1 = "0.11"
x509-cert = { version = "0.2", default-features = false, features = ["builder"] }

[lints]
workspace = true
