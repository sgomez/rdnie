name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: ['agent/developer/spec-*']

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      matrix:
        include:
          # Formatting and lints are the same on every OS; the tests are not.
          - os: ubuntu-latest
            recipe: check
            components: rustfmt, clippy
          - os: macos-latest
            recipe: test
          - os: windows-latest
            recipe: test
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: just ${{ matrix.recipe }}
