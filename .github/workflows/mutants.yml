name: Mutants

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'Cargo.toml', 'Cargo.lock', '.cargo/mutants.toml']
  schedule:
    - cron: '0 3 * * 6'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every run mutates the checkout in place, so the cached target/ spares rebuilding the dependencies.
# Exit 3 means only timeouts: the mutant hung the tests, so they caught it.

jobs:
  diff:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - &toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - &cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - &tools
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-mutants@27.1.0,just
      - &pcsc
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: git diff "${{ github.event.before }}" "${{ github.sha }}" > "$RUNNER_TEMP/push.diff"
      - run: just mutants --in-place --in-diff "$RUNNER_TEMP/push.diff" || [ $? -eq 3 ]
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-diff
          path: mutants.out/*.txt

  full:
    if: github.event_name != 'push'
    name: full (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *toolchain
      - *cache
      - *tools
      - *pcsc
      - run: just mutants --in-place --shard ${{ matrix.shard }}/4 || [ $? -eq 3 ]
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.shard }}
          path: mutants.out/*.txt

  # One open issue collects every failing run, a comment each.
  report:
    needs: [diff, full]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-*
          path: mutants
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: Missed mutants
        run: |
          {
            echo "${{ github.event_name }} on \`${{ github.sha }}\`: $RUN_URL"
            echo
            echo '```'
            cat mutants/*/missed.txt 2>/dev/null || echo 'no mutant list: see the run'
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          number=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$TITLE" --label needs-triage --body-file "$RUNNER_TEMP/body.md"
          fi
