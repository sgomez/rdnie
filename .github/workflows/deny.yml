name: Deny

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', 'deny.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny,just
      - run: just deny
