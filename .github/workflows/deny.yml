name: Deny

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches: [main]
    paths: ['**/Cargo.toml', 'Cargo.lock', 'deny.toml']
  pull_request:
    paths: ['**/Cargo.toml', 'Cargo.lock', 'deny.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny,just
      - run: just deny
