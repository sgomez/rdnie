# A git hook runs in a non-interactive shell, where just and cargo are not on the PATH.

pre-commit:
  jobs:
    - name: fmt-check
      fail_text: "fix the formatting with just fmt"
      run: PATH="$HOME/.cargo/bin:$PATH" just fmt-check

pre-push:
  jobs:
    - name: check
      run: PATH="$HOME/.cargo/bin:$PATH" just check
