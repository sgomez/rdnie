[package]
name = "rdnie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
description = "Spanish electronic ID card (DNIe) driver over PC/SC: CWA-14890 secure channel, certificates, PIN retry counter and signing"
repository = "https://github.com/sgomez/rdnie"
readme = "README.md"
include = ["/src", "/examples", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md"]
keywords = ["dnie", "smartcard", "pcsc", "apdu", "signature"]
categories = ["cryptography", "hardware-support"]

[features]
default = ["pcsc"]
pcsc = ["dep:pcsc"]
# Adds `Session::open_trusting`, for tests against an emulated card; never enable it in production.
emulator = []

[workspace]
members = ["rdnie-emulator"]

[[example]]
name = "detect"
required-features = ["pcsc"]

[[example]]
name = "probe"
required-features = ["pcsc"]

[dependencies]
cbc = { version = "0.2", features = ["alloc"] }
der = "0.7"
des = "0.9"
flate2 = "1"
pcsc = { version = "2.9", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
retail-mac = "0.1"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "hazmat"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
zeroize = "1"

[dev-dependencies]
rdnie-emulator = { path = "rdnie-emulator", features = ["faults"] }
rpassword = "7"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "sha2"] }
# The version `rsa` 0.9 verifies with; the crate itself hashes with 0.11.
sha2_010 = { package = "sha2", version = "0.10" }
x509-cert = { version = "0.2", default-features = false, features = ["builder"] }

# The emulator generates RSA keys at run time.
[profile.dev.package.num-bigint-dig]
opt-level = 3

# With debug assertions, pcsc panics on codes outside PC/SC, such as the Win32 0x458 WinSCard
# returns for a pulled card; without them it reports `UnknownError`. Consumers need it too.
[profile.dev.package.pcsc]
debug-assertions = false

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)", 'cfg(feature, values("faults"))'] }
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
