[package]
name = "rdnie"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "EUPL-1.2"
description = "Spanish electronic ID card (DNIe) driver over PC/SC: CWA-14890 secure channel, certificates, PIN retry counter and signing"
repository = "https://github.com/sgomez/rdnie"
readme = "README.md"
keywords = ["dnie", "smartcard", "pcsc", "apdu", "signature"]
categories = ["cryptography", "hardware-support"]

[features]
default = ["pcsc"]
pcsc = ["dep:pcsc"]

[[example]]
name = "detect"
required-features = ["pcsc"]

[[example]]
name = "probe"
required-features = ["pcsc"]

[dependencies]
cbc = { version = "0.2", features = ["alloc"] }
der = "0.7"
des = "0.9"
flate2 = "1"
pcsc = { version = "2.9", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }
retail-mac = "0.1"
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "hazmat"] }
sha1 = "0.11"
sha2 = "0.11"
thiserror = "2"
x509-cert = { version = "0.2", default-features = false, features = ["std"] }
zeroize = "1"

[dev-dependencies]
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "sha2"] }
x509-cert = { version = "0.2", default-features = false, features = ["builder"] }

# The emulator generates RSA keys at test time.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
